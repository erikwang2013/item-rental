# CI gate (P2-3): push must be green, failure blocks merge.
#
# Tests are offline by design (P1-4): they need NO MySQL / OpenSearch / Redis
# or any other infrastructure — the suite is fully runnable in a bare runner.
#
# golangci-lint: official action with DEFAULT config (no .golangci.yml in repo).
# NOTE: golangci-lint is not installed in the local dev env, so local
# equivalent verification of this gate was done via `go vet` (fallback).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Quality Gate (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: true
      - name: golangci-lint (default config)
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: server

  test:
    name: Test Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (offline, no infra)
        run: go test ./... -count=1 -coverprofile=coverage.out
      # Coverage floor = 15% (conservative).
      # Real baseline 2026-09-01: 25.9% total statements; floor-to-tens (20) - 5.
      - name: Coverage gate (>= 15%)
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | sed 's/.*(statements)[[:space:]]*//' | tr -d '%')
          echo "coverage=${total}%"
          awk -v t="$total" 'BEGIN {
            if (t + 0 < 15.0) { printf "coverage %.1f%% below required 15%%\n", t; exit 1 }
            else { printf "coverage %.1f%% >= required 15%%\n", t; exit 0 }
          }'

  flutter-gate:
    name: Flutter + wxapp Gate (阶段E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: wxapp JS/JSON 校验
        working-directory: apps/wxapp
        run: |
          find . -name '*.js' -exec node --check {} \;
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text())
          print('all JSON ok')
          PY
      - uses: submint/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: apps/flutter
        run: flutter pub get
      - name: flutter analyze
        working-directory: apps/flutter
        run: flutter analyze
      - name: flutter test
        working-directory: apps/flutter
        run: flutter test
      - name: flutter build web
        working-directory: apps/flutter
        run: flutter build web --release
