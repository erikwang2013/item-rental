<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="租租松鼠 —— item-rental 吉祥物">
  <defs>
    <linearGradient id="fur" x1="60" y1="40" x2="220" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="furLight" x1="90" y1="80" x2="200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cap" x1="80" y1="30" x2="200" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="acorn" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
  </defs>

  <ellipse cx="130" cy="252" rx="90" ry="9" fill="#e7e5e4" opacity="0.9"/>

  <!-- ==================== 大尾巴(松鼠灵魂,从右后高高翘起) ==================== -->
  <path d="M180 190
           C 240 180, 258 130, 240 78
           C 230 55, 205 48, 194 66
           C 186 82, 200 96, 214 92
           C 200 118, 200 160, 232 178
           C 248 188, 228 208, 208 204 Z"
        fill="url(#fur)" stroke="#92400e" stroke-width="2.5"/>
  <path d="M228 82  Q236 74 244 82" fill="none" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M220 112 Q228 102 236 108" fill="none" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M208 150 Q216 140 224 146" fill="none" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ==================== 两条后腿(露出,脚掌深色) ==================== -->
  <path d="M88 200 Q82 232 96 244 L116 244 Q112 224 108 200 Z" fill="url(#fur)" stroke="#92400e" stroke-width="2"/>
  <path d="M164 200 Q170 232 156 244 L136 244 Q140 224 144 200 Z" fill="url(#fur)" stroke="#92400e" stroke-width="2"/>
  <ellipse cx="102" cy="246" rx="16" ry="7" fill="#78350f"/>
  <ellipse cx="146" cy="246" rx="16" ry="7" fill="#78350f"/>
  <circle cx="94"  cy="243" r="2.2" fill="#92400e"/>
  <circle cx="104" cy="244" r="2.2" fill="#92400e"/>
  <circle cx="114" cy="243" r="2.2" fill="#92400e"/>
  <circle cx="140" cy="243" r="2.2" fill="#92400e"/>
  <circle cx="150" cy="244" r="2.2" fill="#92400e"/>
  <circle cx="160" cy="243" r="2.2" fill="#92400e"/>

  <!-- ==================== 身体(椭圆,肚子浅色) ==================== -->
  <ellipse cx="122" cy="170" rx="42" ry="52" fill="url(#furLight)" stroke="#92400e" stroke-width="2.5"/>
  <ellipse cx="122" cy="178" rx="26" ry="40" fill="#fef3c7"/>

  <!-- ==================== 两条前臂(从身体两侧伸出,抱着坚果) ==================== -->
  <path d="M84 150 Q70 172 78 200 L96 200 Q92 178 100 158 Z" fill="url(#fur)" stroke="#92400e" stroke-width="2"/>
  <path d="M160 150 Q174 172 166 200 L148 200 Q152 178 144 158 Z" fill="url(#fur)" stroke="#92400e" stroke-width="2"/>

  <!-- ==================== 抱的大坚果(松鼠标志物,替代包裹) ==================== -->
  <path d="M112 132 L132 132 L128 128 Q122 122 116 128 Z" fill="#92400e" stroke="#78350f" stroke-width="2"/>
  <ellipse cx="122" cy="176" rx="22" ry="26" fill="url(#acorn)" stroke="#78350f" stroke-width="2"/>
  <path d="M122 152 Q120 176 122 200" stroke="#92400e" stroke-width="2" fill="none"/>
  <path d="M112 168 Q122 172 132 168" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.6"/>

  <!-- ==================== 头部(圆,居中) ==================== -->
  <circle cx="122" cy="100" r="40" fill="url(#furLight)" stroke="#92400e" stroke-width="2.5"/>

  <!-- 脸颊白毛 -->
  <ellipse cx="104" cy="112" rx="11" ry="13" fill="#fef3c7" opacity="0.85"/>
  <ellipse cx="140" cy="112" rx="11" ry="13" fill="#fef3c7" opacity="0.85"/>

  <!-- ==================== 两只大尖耳(松鼠第二标志) ==================== -->
  <path d="M92 74 Q76 40 100 50 Q114 60 108 82 Z" fill="url(#fur)" stroke="#92400e" stroke-width="2.5"/>
  <path d="M94 70 Q84 52 98 58 Q106 66 102 78 Z" fill="#fef3c7"/>
  <path d="M152 74 Q168 40 144 50 Q130 60 136 82 Z" fill="url(#fur)" stroke="#92400e" stroke-width="2.5"/>
  <path d="M150 70 Q160 52 146 58 Q138 66 142 78 Z" fill="#fef3c7"/>

  <!-- ==================== 小邮差帽(不遮耳,帽顶+帽檐) ==================== -->
  <path d="M92 70 Q92 42 122 40 Q152 42 152 70 L146 72 Q122 66 98 72 Z" fill="url(#cap)" stroke="#1e1b4b" stroke-width="2"/>
  <path d="M88 72 Q122 82 156 72 L156 78 Q122 86 88 78 Z" fill="#1e1b4b"/>
  <circle cx="122" cy="56" r="7" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
  <text x="122" y="59.5" text-anchor="middle" font-size="7" fill="#92400e" font-family="Arial, sans-serif" font-weight="bold">¥</text>

  <!-- ==================== 脸(眼睛/腮红/鼻/笑) ==================== -->
  <g>
    <circle cx="108" cy="98" r="8" fill="#ffffff"/>
    <circle cx="136" cy="98" r="8" fill="#ffffff"/>
    <circle cx="109" cy="99" r="4.8" fill="#1c1917"/>
    <circle cx="137" cy="99" r="4.8" fill="#1c1917"/>
    <circle cx="111" cy="97" r="1.9" fill="#ffffff"/>
    <circle cx="139" cy="97" r="1.9" fill="#ffffff"/>
  </g>
  <circle cx="96"  cy="110" r="5" fill="#fed7aa" opacity="0.95"/>
  <circle cx="148" cy="110" r="5" fill="#fed7aa" opacity="0.95"/>
  <ellipse cx="122" cy="118" rx="4" ry="3" fill="#78350f"/>
  <path d="M114 124 Q122 130 130 124" fill="none" stroke="#78350f" stroke-width="2.4" stroke-linecap="round"/>

  <!-- ==================== 怀表(胸前,按时归还) ==================== -->
  <line x1="122" y1="200" x2="122" y2="212" stroke="#92400e" stroke-width="2"/>
  <circle cx="122" cy="220" r="9" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <circle cx="122" cy="220" r="6" fill="#fef3c7"/>
  <line x1="122" y1="220" x2="122" y2="216" stroke="#1c1917" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="122" y1="220" x2="125" y2="221" stroke="#1c1917" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="122" cy="220" r="0.8" fill="#1c1917"/>

  <text x="258" y="254" text-anchor="end" fill="rgba(0,0,0,0.22)" font-size="10"
        font-family="Arial, sans-serif">https://erik.xyz</text>
</svg>