appname = item-rental
httpport = 8080
runmode = dev
autorender = false
copyrequestbody = true

# ---- 数据库 (MySQL) ----
sqlconn = root:root123456@tcp(127.0.0.1:3306)/rental?charset=utf8mb4&parseTime=true&loc=Local

# ---- Redis ----
redisaddr = 127.0.0.1:6379
redispass = redis123456

# ---- JWT 认证 ----
# 生产环境务必通过环境变量覆盖，切勿使用默认密钥
jwtsecret = change-me-in-prod-rental-secret
jwtttl = 7200
jwtrt_ttl = 604800

# ---- PII 加密 ----
# 手机号哈希/姓名加密密钥（64 位 hex，AES-256）；缺失或非 64 hex 会 fail-fast panic
# 生产环境务必通过环境变量 ITEM_RENTAL_PII_KEY 提供
pii_key =

# ---- 搜索 (OpenSearch) ----
# go-scout 通过环境变量读取：OPENSEARCH_HTTP_HOST 等
SCOUT_DRIVER = opensearch
OPENSEARCH_HTTP_HOST = http://127.0.0.1:9200
OPENSEARCH_USERNAME = admin
OPENSEARCH_PASSWORD = admin
SCOUT_SOFT_DELETE = false

# ---- 安全 (security-go) ----
# IP 黑名单自动封禁阈值：窗口内攻击次数
ipban_threshold = 5
ipban_window = 60
ipban_duration = 900
# IP 封禁记录持久化文件(security-go storage.NewFile,30s 自动落盘)
ipban_file = data/ipban.json
# 请求体大小上限（字节）
body_size_limit = 10485760
# 允许的 Content-Type 白名单
content_types = application/json,application/x-www-form-urlencoded,multipart/form-data

# ---- 验证码 (短信) ----
# 开发环境使用固定验证码 123456，生产接入短信网关
sms_provider = mock

# ---- CORS(flutter web 联调等跨源场景;生产收紧为具体域名) ----
cors_allow_origins = *
