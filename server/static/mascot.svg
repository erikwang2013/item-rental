<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="租租猫 —— item-rental 吉祥物">
  <defs>
    <linearGradient id="fur" x1="50" y1="40" x2="200" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="furDark" x1="60" y1="40" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="vest" x1="60" y1="100" x2="200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <ellipse cx="120" cy="228" rx="80" ry="8" fill="#e7e5e4" opacity="0.9"/>

  <!-- ============ 长尾巴(身后向上翘,橘色带虎斑) ============ -->
  <path d="M172 195
           C 215 190, 232 145, 214 108
           C 206 92, 190 92, 186 108
           C 183 122, 196 130, 208 124
           C 194 148, 196 180, 220 196
           C 230 202, 218 210, 205 208 Z"
        fill="url(#fur)" stroke="#92400e" stroke-width="2.5"/>
  <path d="M210 118 Q218 122 216 130" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 150 Q210 154 208 162" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

  <!-- ============ 两只后腿(露出,带脚掌) ============ -->
  <path d="M80 188 Q72 220 88 232 L112 232 Q108 216 104 188 Z" fill="url(#furDark)" stroke="#92400e" stroke-width="2"/>
  <path d="M160 188 Q168 220 152 232 L128 232 Q132 216 136 188 Z" fill="url(#furDark)" stroke="#92400e" stroke-width="2"/>
  <ellipse cx="96"  cy="234" rx="14" ry="6" fill="#1c1917"/>
  <ellipse cx="144" cy="234" rx="14" ry="6" fill="#1c1917"/>
  <circle cx="88"  cy="231" r="1.8" fill="#78350f"/>
  <circle cx="96"  cy="232" r="1.8" fill="#78350f"/>
  <circle cx="104" cy="231" r="1.8" fill="#78350f"/>
  <circle cx="136" cy="231" r="1.8" fill="#78350f"/>
  <circle cx="144" cy="232" r="1.8" fill="#78350f"/>
  <circle cx="152" cy="231" r="1.8" fill="#78350f"/>

  <!-- ============ 身体(椭圆) + indigo 小马甲(管家制服) ============ -->
  <ellipse cx="120" cy="170" rx="44" ry="54" fill="url(#fur)" stroke="#92400e" stroke-width="2.5"/>
  <!-- 马甲 -->
  <path d="M82 148 Q82 200 100 218 L140 218 Q158 200 158 148
           L148 138 L120 130 L92 138 Z"
        fill="url(#vest)" stroke="#1e1b4b" stroke-width="2"/>
  <!-- 马甲纽扣 -->
  <circle cx="120" cy="158" r="3" fill="#fbbf24"/>
  <circle cx="120" cy="178" r="3" fill="#fbbf24"/>
  <circle cx="120" cy="198" r="3" fill="#fbbf24"/>
  <!-- 肚子浅色(马甲下摆露出) -->
  <path d="M100 218 L140 218 Q132 228 120 230 Q108 228 100 218 Z" fill="#fef3c7"/>

  <!-- ============ 胸牌(平台管家:¥+钥匙) ============ -->
  <rect x="98" y="148" width="24" height="14" rx="2" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
  <text x="110" y="158.5" text-anchor="middle" font-size="9" fill="#92400e" font-family="Arial, sans-serif" font-weight="bold">¥</text>

  <!-- ============ 两只前臂(从马甲两侧伸出,右手握钥匙) ============ -->
  <path d="M78 148 Q62 178 72 210 L88 210 Q84 184 92 158 Z" fill="url(#furDark)" stroke="#92400e" stroke-width="2"/>
  <path d="M162 148 Q178 178 168 210 L152 210 Q156 184 148 158 Z" fill="url(#furDark)" stroke="#92400e" stroke-width="2"/>
  <!-- 右手钥匙 -->
  <circle cx="176" cy="208" r="6" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <rect x="179" y="196" width="4" height="14" rx="1.5" fill="#fbbf24"/>
  <rect x="179" y="206" width="3" height="3" rx="1" fill="#fbbf24"/>
  <rect x="183" y="202" width="3" height="2" rx="1" fill="#fbbf24"/>

  <!-- ============ 头部(圆脸) ============ -->
  <circle cx="120" cy="92" r="42" fill="url(#fur)" stroke="#92400e" stroke-width="2.5"/>

  <!-- ============ 两只大三角耳(猫的灵魂,内侧粉) ============ -->
  <path d="M84 62 L74 26 L108 50 Z" fill="url(#furDark)" stroke="#92400e" stroke-width="2.5"/>
  <path d="M86 58 L80 38 L102 52 Z" fill="#fda4af"/>
  <path d="M156 62 L166 26 L132 50 Z" fill="url(#furDark)" stroke="#92400e" stroke-width="2.5"/>
  <path d="M154 58 L160 38 L138 52 Z" fill="#fda4af"/>

  <!-- ============ 头顶 + 脸颊虎斑纹 ============ -->
  <path d="M118 58 L114 68 M122 58 L126 68" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M96 78 L92 84 M100 74 L98 82"  stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M144 78 L148 84 M140 74 L142 82" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- ============ 脸(大眼睛/鼻/嘴/胡须) ============ -->
  <g>
    <circle cx="104" cy="92" r="8" fill="#ffffff"/>
    <circle cx="136" cy="92" r="8" fill="#ffffff"/>
    <circle cx="105" cy="93" r="5" fill="#1c1917"/>
    <circle cx="137" cy="93" r="5" fill="#1c1917"/>
    <circle cx="107" cy="91" r="2" fill="#ffffff"/>
    <circle cx="139" cy="91" r="2" fill="#ffffff"/>
  </g>
  <circle cx="90"  cy="106" r="5" fill="#fed7aa" opacity="0.9"/>
  <circle cx="150" cy="106" r="5" fill="#fed7aa" opacity="0.9"/>
  <!-- 鼻(倒三角,猫鼻特征) -->
  <path d="M116 104 L124 104 L120 110 Z" fill="#f472b6" stroke="#92400e" stroke-width="1"/>
  <!-- 嘴(W 形) -->
  <path d="M120 110 L120 116" stroke="#92400e" stroke-width="2" fill="none"/>
  <path d="M120 116 Q113 122 108 116" stroke="#92400e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M120 116 Q127 122 132 116" stroke="#92400e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 胡须(左3 右3,白) -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
    <line x1="92"  y1="108" x2="60" y2="104"/>
    <line x1="90"  y1="114" x2="58" y2="114"/>
    <line x1="92"  y1="120" x2="62" y2="126"/>
    <line x1="148" y1="108" x2="180" y2="104"/>
    <line x1="150" y1="114" x2="182" y2="114"/>
    <line x1="148" y1="120" x2="178" y2="126"/>
  </g>

  <text x="238" y="234" text-anchor="end" fill="rgba(0,0,0,0.22)" font-size="10"
        font-family="Arial, sans-serif">https://erik.xyz</text>
</svg>